<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TezBooks</title>
<meta name="robots" content="noindex">
<script>
  // shop order links look like tezbooks.com/o/shop-name — send them to the order page
  (function () {
    var m = location.pathname.match(/^\/o\/([a-zA-Z0-9-]{3,30})\/?$/);
    if (m) location.replace('/o/?s=' + m[1].toLowerCase() + location.search.replace(/^\?/, '&'));
  })();
</script>

</head>
