<style>
h1,h2,header b{font-family:Cinzel,'Trajan Pro',Georgia,serif;letter-spacing:.03em}header b{text-transform:uppercase}
:root{
  --bg:#f5f2eb; --surface:#fff; --ink:#1a1d26; --muted:#6a6e79; --line:#e5e0d5; --line2:#d6d0c2;
  --retail:#c2410c; --retail-soft:#fff1e8; --whole:#0f766e; --whole-soft:#e6f5f2;
  --danger:#b42318; --danger-soft:#fdecea; --ok:#15803d; --ok-soft:#e8f6ec; --warn:#a16207; --warn-soft:#fdf6e3;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Montserrat,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:#1b2440;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
.top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top .nm{flex:1;min-width:0}
.top b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:#b9bac0}
.top select{background:#262a35;color:#fff;border:1px solid #3a3f4c;border-radius:8px;padding:6px 8px;max-width:150px}
.ibtn{background:#262a35;border:1px solid #3a3f4c;color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:20px;height:20px}
.ibtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.banner{border:1px solid;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.45}
.banner.warn{background:var(--warn-soft);border-color:#ecd9a5;color:#713f12}
.banner.bad{background:var(--danger-soft);border-color:#f3c3bd;color:#7a1a12}
.banner.info{background:#eef2ff;border-color:#c7d2fe;color:#312e81}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:0 -14px 12px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.plabel{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat.wide{grid-column:1/-1}
.stat .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-top:2px;font-family:var(--mono)}
.stat.wide .v{font-size:30px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar{height:8px;background:#efebe2;border-radius:6px;overflow:hidden;margin:5px 0 10px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;background:#cfc8b8;border-radius:4px 4px 0 0;min-height:2px}
.chart .c.on i{background:var(--retail)}
.chart .c span{font-size:10px;color:var(--muted);font-family:var(--mono)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{display:block;color:var(--muted);font-size:12px}
.li .a{font-family:var(--mono);font-weight:700;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#efebe2;color:var(--ink);vertical-align:middle}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.cx{text-decoration:line-through;opacity:.55}
.act{display:flex;gap:6px}
.act a{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);text-decoration:none}
.act a svg{width:18px;height:18px}
.ag{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:6px 0 4px;background:#efebe2}
.ag i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.lines div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.lines .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.btn{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--danger);border-color:#f0c4bf}
.center{text-align:center;padding:40px 10px}
.center h1{font-size:22px;margin:10px 0 8px}
.center p{color:var(--muted);line-height:1.55;margin:0 auto 16px;max-width:380px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}
.foot button{background:none;border:0;color:var(--danger);font-weight:700;cursor:pointer;padding:6px}
.skel{height:84px;border-radius:12px;background:linear-gradient(90deg,#ebe6db,#f3efe7,#ebe6db);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
</style>

<script>
'use strict';
// TezBooks · owner's phone dashboard. Reads the shop's summary from Elite Kaiiser's cloud.
const CLOUD_URL = 'https://zneltnwixmrkjbevxwaw.supabase.co';
const CLOUD_KEY = 'sb_publishable_hZy5OM-vGb-rgH_eRVVB_Q_vlGaXy4w';

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const F0 = new Intl.NumberFormat('en-IN', {maximumFractionDigits: 0});
const F2 = new Intl.NumberFormat('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = n => (Math.round(n || 0) < 0 ? '−₹' : '₹') + F0.format(Math.abs(Math.round(n || 0)));
const money = n => (r2(n || 0) < 0 ? '−₹' : '₹') + F2.format(Math.abs(r2(n || 0)));
const qty = n => { const v = r2(n); return String(v); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const addDays = (key, n) => { const d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dLabel = key => { const [, m, d] = key.split('-').map(Number); return d + ' ' + MON[m - 1]; };
const shopTime = (ms, tz) => { const d = new Date(ms + (tz || 0) * 60000); return {key: d.toISOString().slice(0, 10), h: d.getUTCHours(), mi: d.getUTCMinutes()}; };
const hm12 = (h, mi) => `${h % 12 || 12}:${String(mi).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`;
const when = (ms, tz, today) => { const t = shopTime(ms, tz); return (t.key === today ? '' : dLabel(t.key) + ', ') + hm12(t.h, t.mi); };
const ago = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 45 ? 'just now' : s < 90 ? '1 min ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago'; };
const ICON = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2L9 9.5z"/></svg>'
};
const ALERT = {cancel: '❌', discount: '💸', belowcost: '⚠️', stock: '📦', price: '🏷', return: '↩️', cash: '💰'};
const PERIODS = [['today', 'Today'], ['yday', 'Yesterday'], ['7d', '7 days'], ['month', 'This month'], ['last', 'Last month']];
const FIELDS = ['sales', 'bills', 'cxl', 'ret', 'retN', 'retail', 'retailN', 'whole', 'wholeN', 'paid', 'credit', 'recv', 'recvN', 'refund', 'exp', 'expN', 'cost', 'gp', 'tax', 'purch', 'purchN'];

const S = {shops: LS.get('kbdash.shops', []), cur: LS.get('kbdash.cur', ''), period: LS.get('kbdash.period', 'today'),
  view: null, fetchedAt: 0, offline: false, denied: false, loading: false, lastTry: 0, error: ''};
if (!Array.isArray(S.shops)) S.shops = [];
const save = () => { LS.set('kbdash.shops', S.shops); LS.set('kbdash.cur', S.cur); };
const cur = () => S.shops.find(s => s.shop === S.cur) || S.shops[0] || null;

// A link from the shop computer looks like  …/#k=<shop id>.<token>
function takeLink() {
  const m = /[#&]k=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.([0-9a-f]{64})(?:&|$)/i.exec(location.hash);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (!m) return;
  const shop = m[1].toLowerCase(), token = m[2].toLowerCase();
  const ex = S.shops.find(s => s.shop === shop);
  if (ex) ex.token = token; else S.shops.push({shop, token, name: ''});
  S.cur = shop; save();
}

function useCache(sh) {
  const c = LS.get('kbdash.data.' + sh.shop, null);
  if (c && c.view && c.view.data) { S.view = c.view; S.fetchedAt = c.fetchedAt || 0; return true; }
  S.view = null; S.fetchedAt = 0; return false;
}

async function load() {
  const sh = cur();
  if (!sh) { render(); return; }
  if (S.loading) return;
  S.loading = true; S.lastTry = Date.now(); drawTop();
  try {
    const r = await fetch(CLOUD_URL + '/rest/v1/rpc/kb_view', {method: 'POST', cache: 'no-store',
      headers: {'apikey': CLOUD_KEY, 'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({p_shop: sh.shop, p_token: sh.token})});
    const j = await r.json().catch(() => null);
    if (sh !== cur()) return; // switched shop meanwhile
    if (r.status === 403 || (j && /kb_denied/.test(j.message || ''))) {
      S.denied = true; S.offline = false; S.view = null; LS.del('kbdash.data.' + sh.shop);
    } else if (!r.ok || !j) {
      throw new Error((j && j.message) || 'The server answered ' + r.status);
    } else {
      S.denied = false; S.offline = false; S.error = ''; S.view = j; S.fetchedAt = Date.now();
      if (j.name) sh.name = j.name;
      save(); LS.set('kbdash.data.' + sh.shop, {view: j, fetchedAt: S.fetchedAt});
    }
  } catch (e) {
    if (sh !== cur()) return;
    S.offline = true; S.error = String(e && e.message || e);
    if (!S.view) useCache(sh);
  } finally {
    S.loading = false; render();
  }
}

function periodKeys(p, today) {
  if (p === 'yday') return [addDays(today, -1)];
  if (p === '7d') return Array.from({length: 7}, (_, i) => addDays(today, i - 6));
  if (p === 'month' || p === 'last') {
    let end = today;
    if (p === 'last') end = addDays(today.slice(0, 8) + '01', -1);
    const out = []; for (let k = end.slice(0, 8) + '01'; k <= end; k = addDays(k, 1)) out.push(k); return out;
  }
  return [today];
}
function periodLabel(p, keys) {
  if (p === 'today') return 'Today · ' + dLabel(keys[0]);
  if (p === 'yday') return 'Yesterday · ' + dLabel(keys[0]);
  if (p === '7d') return 'Last 7 days · ' + dLabel(keys[0]) + ' – ' + dLabel(keys[keys.length - 1]);
  const [y, m] = keys[0].split('-').map(Number);
  return (p === 'month' ? 'This month · ' : 'Last month · ') + MON[m - 1] + ' ' + y;
}
function sumDays(days, keys) {
  const t = {pay: {}}; FIELDS.forEach(f => t[f] = 0);
  for (const k of keys) {
    const d = days[k]; if (!d) continue;
    FIELDS.forEach(f => t[f] += +d[f] || 0);
    for (const [m, v] of Object.entries(d.pay || {})) t.pay[m] = (t.pay[m] || 0) + (+v || 0);
  }
  FIELDS.forEach(f => t[f] = r2(t[f]));
  for (const m of Object.keys(t.pay)) t.pay[m] = r2(t.pay[m]);
  t.net = r2(t.sales - t.ret); t.received = r2(t.paid + t.recv - t.refund); t.netProfit = r2(t.gp - t.exp);
  return t;
}

function drawTop() {
  const sh = cur(), v = S.view, d = v && v.data;
  $('#shopName').textContent = (v && v.name) || (sh && sh.name) || 'My shop';
  document.title = ((v && v.name) || 'My shop') + ' · TezBooks';
  let sub = '';
  if (d && d.at) sub = 'Updated ' + ago(d.at) + (S.offline ? ' · offline' : '');
  else if (S.loading) sub = 'Loading…';
  $('#updated').textContent = sub;
  $('#refresh').classList.toggle('spin', S.loading);
  const pick = $('#shopPick');
  if (S.shops.length > 1) {
    if (!$('#shopSel')) pick.innerHTML = '<select id="shopSel" aria-label="Shop"></select>';
    $('#shopSel').innerHTML = S.shops.map(s => `<option value="${esc(s.shop)}" ${s === sh ? 'selected' : ''}>${esc(s.name || 'Shop')}</option>`).join('');
    $('#shopSel').onchange = e => { S.cur = e.target.value; save(); S.denied = false; S.offline = false; useCache(cur()); render(); load(); };
  } else pick.innerHTML = '';
}

function removeShop() {
  const sh = cur(); if (!sh) return;
  if (!confirm(`Remove ${sh.name || 'this shop'} from this phone? You can add it again by scanning its QR code.`)) return;
  LS.del('kbdash.data.' + sh.shop);
  S.shops = S.shops.filter(s => s !== sh); S.cur = S.shops[0] ? S.shops[0].shop : ''; save();
  S.view = null; S.denied = false; S.offline = false;
  if (cur()) { useCache(cur()); load(); }
  render();
}

function render() {
  drawTop();
  const main = $('#main'), sh = cur();
  if (!sh) {
    main.innerHTML = `<div class="center" id="welcome"><img src="icon-192.png" width="72" height="72" alt=""><h1>Your shop on your phone</h1>
      <p>Open <b>TezBooks</b> on the shop computer, go to <b>Settings → Owner's phone dashboard</b>, turn it on and scan the QR code with this phone's camera.</p></div>`;
    return;
  }
  if (S.denied) {
    main.innerHTML = `<div class="center" id="denied"><h1>Scan the new QR code</h1>
      <p>This link no longer works. The shop made a new QR code (“Log out all phones”) or turned the phone dashboard off.</p>
      <p>On the shop computer open <b>Settings → Owner's phone dashboard</b> and scan the QR code again.</p>
      <button class="btn danger" id="rmShop">Remove this shop from this phone</button></div>`;
    $('#rmShop').onclick = removeShop;
    return;
  }
  const v = S.view, d = v && v.data;
  if (!d || !d.days) {
    main.innerHTML = S.offline
      ? `<div class="banner bad" id="offline">No internet connection. Connect this phone to the internet to see your shop.</div><div class="center"><button class="btn dark" id="retry">Try again</button></div>`
      : S.loading ? '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'
      : `<div class="center" id="nodata"><h1>Waiting for the shop</h1><p>The shop computer has not sent its first summary yet. Keep TezBooks open on it and connected to the internet.</p></div>`;
    if ($('#retry')) $('#retry').onclick = load;
    return;
  }
  const tz = d.tz || 0, today = d.today, keys = periodKeys(S.period, today), t = sumDays(d.days, keys);
  const fl = d.flags || {}, lic = d.lic || {};
  const banners = [];
  if (S.offline) banners.push(`<div class="banner bad" id="offline">No internet on this phone. Showing the figures saved ${S.fetchedAt ? ago(S.fetchedAt) : 'earlier'}.</div>`);
  if (Date.now() - d.at > 2 * 3600 * 1000) banners.push(`<div class="banner warn" id="stale">The shop computer last sent figures ${ago(d.at)} (${when(d.at, tz, '')}). Is it switched on and connected to the internet?</div>`);
  if (lic.usable === false) banners.push(`<div class="banner bad" id="lic">TezBooks licence: ${esc(lic.message || 'not active')}. Billing is paused on the shop computer.</div>`);
  else if (lic.state === 'active' && lic.daysLeft >= 0 && lic.daysLeft <= 15) banners.push(`<div class="banner warn" id="lic">The TezBooks licence ends in ${lic.daysLeft} day${lic.daysLeft === 1 ? '' : 's'}. Contact Elite Kaiiser to renew.</div>`);

  const stat = (id, k, val, s, cls, color) => `<div class="stat ${cls || ''}" id="${id}" data-v="${r2(val)}"><div class="k">${k}</div><div class="v"${color ? ` style="color:${color}"` : ''}>${money0(val)}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  let stats = stat('stNet', 'Net sales', t.net, `${t.bills} bill${t.bills === 1 ? '' : 's'}${t.cxl ? ` · ${t.cxl} cancelled` : ''}${t.ret ? ` · returns ${money0(t.ret)}` : ''}`, 'wide');
  stats += stat('stRecv', 'Money received', t.received, `${money0(t.paid)} at billing · ${money0(t.recv)} dues${t.refund ? ` · −${money0(t.refund)} refunds` : ''}`);
  stats += stat('stCredit', 'New credit', t.credit, 'unpaid part of bills', '', t.credit ? 'var(--danger)' : '');
  if (t.cost > 0) stats += stat('stGross', 'Gross profit', t.gp, 'items with a purchase cost', '', 'var(--ok)');
  if (t.cost > 0 || t.expN) stats += stat('stProfit', 'Net profit', t.netProfit, `expenses ${money0(t.exp)}`, '', t.netProfit >= 0 ? 'var(--ok)' : 'var(--danger)');
  else stats += stat('stExp', 'Expenses', t.exp, `${t.expN} entr${t.expN === 1 ? 'y' : 'ies'}`);
  if (fl.wholesale && (t.whole || t.wholeN)) { stats += stat('stRetail', 'Retail', t.retail, `${t.retailN} bills`, '', 'var(--retail)'); stats += stat('stWhole', 'Wholesale', t.whole, `${t.wholeN} bills`, '', 'var(--whole)'); }
  if (t.purch) stats += stat('stPurch', 'Purchases', t.purch, `${t.purchN} stock-in${t.purchN === 1 ? '' : 's'}`);

  // payment modes
  const modes = ['Cash', 'UPI', 'Card', 'Credit', ...Object.keys(t.pay).filter(m => !['Cash', 'UPI', 'Card', 'Credit'].includes(m))];
  const payHtml = modes.map(m => { const val = t.pay[m] || 0; return `<div data-mode="${esc(m)}" data-v="${val}"><div class="row small"><b>${esc(m === 'undefined' ? 'Other' : m)}${m === 'Credit' ? ' bills' : ''}</b><span class="num">${money(val)}</span></div><div class="bar"><i style="width:${t.sales ? Math.min(100, val / t.sales * 100).toFixed(1) : 0}%"></i></div></div>`; }).join('');

  // last 14 days chart (net sales)
  const ck = Array.from({length: 14}, (_, i) => addDays(today, i - 13));
  const cv = ck.map(k => { const x = d.days[k]; return x ? r2((+x.sales || 0) - (+x.ret || 0)) : 0; });
  const cmax = Math.max(1, ...cv);
  const chart = `<div class="chart" id="chart">${ck.map((k, i) => `<div class="c${keys.includes(k) ? ' on' : ''}" title="${dLabel(k)}: ${money0(cv[i])}"><i style="height:${Math.max(0, cv[i]) / cmax * 100}%"></i><span>${+k.slice(8)}</span></div>`).join('')}</div>`;

  // cash in drawer (today)
  const c = d.cash;
  const cashHtml = S.period === 'today' && fl.cash !== false && c ? `<div class="card" id="cash"><h2>Cash in drawer<span class="r">${c.closed ? '<span class="tag ok">Day closed</span>' : ''}</span></h2><div class="lines">
      <div><span class="muted">Opening cash</span><span class="num">${money(c.opening)}</span></div>
      <div><span class="muted">+ Cash received</span><span class="num">${money(c.in)}</span></div>
      <div><span class="muted">− Cash paid out</span><span class="num">${money(c.out)}</span></div>
      <div class="tot"><span>Should be in drawer</span><span class="num" data-v="${c.expected}">${money(c.expected)}</span></div></div>
      ${c.closed ? `<div class="small" style="margin-top:6px">Counted ${money(c.counted)}${c.closedBy ? ' by ' + esc(c.closedBy) : ''} · ${c.diff === 0 ? 'matched' : (c.diff > 0 ? 'excess ' : 'short ') + money(Math.abs(c.diff))}</div>` : ''}
      ${Object.entries(c.modes || {}).filter(([, x]) => x.in || x.out).map(([m, x]) => `<div class="row small muted" style="margin-top:4px"><span>${esc(m === 'undefined' ? 'Other' : m)}</span><span class="num">in ${money(x.in)} · out ${money(x.out)}</span></div>`).join('')}</div>` : '';

  // top items
  const itList = S.period === 'today' ? d.items.today : d.items.month, itTitle = S.period === 'today' ? 'Top items today' : 'Top items this month';
  const itMax = itList.length ? Math.max(...itList.map(x => x.amt), 1) : 1;
  const itemsHtml = `<div class="card" id="items"><h2>${itTitle}</h2>${itList.length ? itList.map(x => `<div><div class="row small"><b>${esc(x.name)} <span class="muted" style="font-weight:500">· ${qty(x.qty)} ${esc(x.unit || '')}</span></b><span class="num">${money(x.amt)}</span></div><div class="bar"><i style="width:${(x.amt / itMax * 100).toFixed(1)}%;background:var(--retail)"></i></div></div>`).join('') : '<div class="empty">No sales yet.</div>'}</div>`;

  // recent bills
  const bills = d.bills || [];
  const billsHtml = `<div class="card" id="bills"><h2>Latest bills</h2><div class="list">${bills.length ? bills.slice(0, 15).map(b => `<div class="li${b.st === 'cancelled' ? ' cx' : ''}"><div class="m"><b>${esc(b.cust || 'Walk-in customer')}</b><small>${esc(b.no)} · ${when(b.at, tz, today)}${b.by ? ' · ' + esc(b.by) : ''}</small></div><div class="a">${money(b.total)}<div>${b.st === 'cancelled' ? '<span class="tag bad">Cancelled</span>' : b.due > 0 ? `<span class="tag warn">Due ${money0(b.due)}</span>` : `<span class="tag">${esc(b.pm || '')}</span>`}</div></div></div>`).join('') : '<div class="empty">No bills yet.</div>'}</div></div>`;

  // dues
  const du = d.dues || {total: 0, count: 0, top: [], buckets: {}};
  const bk = du.buckets || {}, bTot = Math.max(1, du.total || 0);
  const bcol = [['cur', 'Not due', '#9ca3af'], ['d30', '1–30 days', '#f59e0b'], ['d60', '31–60', '#ea580c'], ['d90', '61–90', '#dc2626'], ['d90p', '90+', '#7f1d1d']];
  const remind = x => `Namaste ${x.name}, this is a friendly reminder from ${d.shop.name || 'our shop'}. Your pending balance is ₹${F2.format(x.bal)}. Thank you!`;
  const phone10 = p => { const n = String(p || '').replace(/\D/g, ''); return n.length === 10 ? '91' + n : n; };
  const duesHtml = `<div class="card" id="dues"><h2>Money to collect<span class="r num" data-v="${du.total}">${money0(du.total)}</span></h2>
    ${du.count ? `<div class="ag">${bcol.map(([k, , col]) => `<i style="width:${((bk[k] || 0) / bTot * 100).toFixed(2)}%;background:${col}"></i>`).join('')}</div>
    <div class="legend">${bcol.filter(([k]) => bk[k]).map(([k, l, col]) => `<span style="--c:${col}">${l} ${money0(bk[k])}</span>`).join('')}</div>
    <div class="list" style="margin-top:6px">${du.top.map(x => `<div class="li"><div class="m"><b>${esc(x.name)}</b><small>${x.late ? `<span class="tag ${x.late > 30 ? 'bad' : 'warn'}">${x.late} days late</span> ` : ''}${esc(x.phone || '')}</small></div><div class="a">${money(x.bal)}</div>
      ${x.phone ? `<div class="act"><a href="tel:${esc(String(x.phone).replace(/[^\d+]/g, ''))}" aria-label="Call">${ICON.phone}</a><a href="https://wa.me/${phone10(x.phone)}?text=${encodeURIComponent(remind(x))}" target="_blank" rel="noopener" aria-label="WhatsApp reminder">${ICON.wa}</a></div>` : ''}</div>`).join('')}</div>
    ${du.count > du.top.length ? `<div class="small muted">and ${du.count - du.top.length} more</div>` : ''}` : '<div class="empty">Nobody owes you money.</div>'}
    ${d.payables && d.payables.total ? `<div class="small" style="margin-top:8px" id="payables">You owe ${d.payables.count} supplier${d.payables.count === 1 ? '' : 's'} <b class="num">${money0(d.payables.total)}</b></div>` : ''}</div>`;

  const po = d.pos;
  const poHtml = po && po.open ? `<div class="small" style="margin-top:8px" id="pos">${po.open} purchase order${po.open === 1 ? '' : 's'} waiting for goods · <b class="num">${money0(po.value)}</b>${po.late ? ` · <span class="tag bad">${po.late} late</span>` : ''}</div>` : '';
  // stock
  const st = d.stock || {list: []};
  const lowHtml = `<div class="card" id="low"><h2>Low stock<span class="r">${st.low ? `<span class="tag bad">${st.low}</span>` : ''}</span></h2>
    ${st.list.length ? `<div class="list">${st.list.map(p => `<div class="li"><div class="m"><b>${esc(p.name)}</b><small>alert at ${qty(p.min)} ${esc(p.unit || '')}</small></div><div class="a"><span class="tag ${p.stock <= 0 ? 'bad' : 'warn'}">${qty(p.stock)} ${esc(p.unit || '')}</span></div></div>`).join('')}</div>${st.low > st.list.length ? `<div class="small muted">and ${st.low - st.list.length} more</div>` : ''}` : '<div class="empty">All stock above alert levels.</div>'}
    <div class="small muted" style="margin-top:8px">Stock value at cost <b class="num">${money0(st.value)}</b> · ${st.items} items${st.out ? ` · ${st.out} out of stock` : ''}</div>${poHtml}</div>`;

  // online orders
  const od = d.orders;
  const OST = {new: ['New', 'bad'], accepted: ['Accepted', 'warn'], ready: ['Packed', 'warn'], out: ['On the way', 'warn'], delivered: ['Delivered', 'ok'], cancelled: ['Cancelled', '']};
  const ordersHtml = od && od.on ? `<div class="card" id="orders"><h2>Online orders<span class="r">${od.new ? `<span class="tag bad">${od.new} new</span>` : ''}</span></h2>
    <div class="small muted">Today ${od.todayN} order${od.todayN === 1 ? '' : 's'} · <b class="num">${money0(od.today)}</b>${od.active ? ` · ${od.active} in progress` : ''}</div>
    ${od.list && od.list.length ? `<div class="list" style="margin-top:6px">${od.list.map(o => `<div class="li"><div class="m"><b>#${esc(o.no)} ${esc(o.name || '')}</b><small>${when(o.at, tz, '')} · ${o.how === 'pickup' ? 'pickup' : 'delivery'}</small></div><div class="a"><span class="num">${money0(o.total)}</span> <span class="tag ${(OST[o.st] || [])[1] || ''}">${esc((OST[o.st] || [o.st])[0])}</span></div></div>`).join('')}</div>` : '<div class="empty">No orders yet.</div>'}</div>` : '';
  // every place of the business
  const pl = d.places || [];
  const placesHtml = pl.length > 1 ? `<div class="card" id="places"><h2>All branches</h2><div class="list">${pl.map(x => `<div class="li"><div class="m"><b>${esc(x.name)}${x.here ? ' <span class="muted" style="font-weight:500">· this computer</span>' : ''}</b><small>${x.todayN} bill${x.todayN === 1 ? '' : 's'} today${!x.here && x.seen ? ' · online ' + ago(Date.parse(x.seen)) : ''}</small></div><div class="a" style="text-align:right"><span class="num">${money0(x.today)}</span><small class="muted" style="display:block">month ${money0(x.month)}</small></div></div>`).join('')}
    <div class="li" style="font-weight:700"><div class="m">All places</div><div class="a" style="text-align:right"><span class="num">${money0(pl.reduce((a, x) => a + x.today, 0))}</span><small class="muted" style="display:block">month ${money0(pl.reduce((a, x) => a + x.month, 0))}</small></div></div></div>
    <div class="small muted" style="margin-top:6px">Bills of other branches arrive here once they reach this computer.</div></div>` : '';

  // alerts
  const al = d.alerts || {list: [], unseen: 0};
  const alertsHtml = `<div class="card" id="alerts"><h2>Alerts<span class="r">${al.unseen ? `<span class="tag bad">${al.unseen} new</span>` : ''}</span></h2>${al.list.length ? `<div class="list">${al.list.slice(0, 10).map(x => `<div class="li" style="${x.seen ? 'opacity:.6' : ''}"><div style="width:22px;text-align:center">${ALERT[x.type] || '•'}</div><div class="m"><b style="white-space:normal;font-weight:600">${esc(x.text)}</b><small>${when(x.at, tz, today)}${x.by ? ' · ' + esc(x.by) : ''}</small></div></div>`).join('')}</div>` : '<div class="empty">No alerts. Cancelled bills, big discounts, sales below cost, price changes and cash differences show up here.</div>'}</div>`;

  // staff today
  const staff = d.staff || [];
  const staffHtml = staff.length > 1 || (fl.staff && staff.length) ? `<div class="card" id="staff"><h2>Bills by staff today</h2><div class="list">${staff.map(x => `<div class="li"><div class="m"><b>${esc(x.name)}</b><small>${x.bills} bill${x.bills === 1 ? '' : 's'}${x.cxl ? ` · <span style="color:var(--danger)">${x.cxl} cancelled</span>` : ''}</small></div><div class="a">${money(x.total)}</div></div>`).join('')}</div></div>` : '';

  main.innerHTML = `${banners.join('')}
    <div class="tabs" role="tablist">${PERIODS.map(([k, l]) => `<button data-p="${k}" class="${S.period === k ? 'on' : ''}" role="tab" aria-selected="${S.period === k}">${l}</button>`).join('')}</div>
    <div class="plabel" id="plabel">${periodLabel(S.period, keys)}</div>
    <div class="stats">${stats}</div>
    <div class="card" id="pay"><h2>Payment modes</h2><div id="payBars">${payHtml}</div>${t.recvN ? `<div class="small muted">Plus ${t.recvN} due payment${t.recvN === 1 ? '' : 's'} received: ${money(t.recv)}</div>` : ''}</div>
    <div class="card"><h2>Last 14 days<span class="r">net sales</span></h2>${chart}</div>
    ${ordersHtml}${placesHtml}${cashHtml}${itemsHtml}${duesHtml}${lowHtml}${alertsHtml}${staffHtml}${billsHtml}
    <div class="foot">TezBooks · Elite Kaiiser<br>${d.app ? 'Shop program ' + esc(d.app) + ' · ' : ''}figures from ${when(d.at, tz, '')}<br><button id="rmShop">Remove this shop from this phone</button></div>`;
  main.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.period = b.dataset.p; LS.set('kbdash.period', S.period); render(); window.scrollTo({top: 0}); });
  $('#rmShop').onclick = removeShop;
}

takeLink();
if (cur()) { S.cur = cur().shop; useCache(cur()); }
render();
load();
$('#refresh').onclick = () => load();
setInterval(() => { if (!document.hidden) load(); else drawTop(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.lastTry > 10000) load(); });
window.addEventListener('focus', () => { if (Date.now() - S.lastTry > 10000) load(); });
window.addEventListener('online', () => load());
window.addEventListener('hashchange', () => { if (/k=/.test(location.hash)) { takeLink(); S.denied = false; S.offline = false; useCache(cur()); render(); load(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
