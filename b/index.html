<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Your bill · TezBooks</title>
<style>
:root{--navy:#141a2e;--ivory:#F7F0E5;--card:#fffdf9;--ink:#1c2236;--muted:#6b7084;--line:#e8dfcf;--sf:#c2410c;--green:#1f7a4d;--red:#b42318;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--ivory);color:var(--ink);line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{background:var(--navy);color:#fff;padding:16px 0}
header h1{margin:0;font-size:20px;font-weight:800}
header .sub{color:#c9c4ba;font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.mono{font-family:var(--mono);font-weight:600}
.big{font-size:26px;font-weight:800;font-family:var(--mono)}
.due{color:var(--red)}
.paid{color:var(--green)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{flex:1;min-width:150px;display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.pri{background:var(--sf);border-color:var(--sf);color:#fff}
.frame{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.frame iframe{border:0;display:block;transform-origin:0 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.r{text-align:right}
.msg{text-align:center;color:var(--muted);padding:60px 10px}
.small{font-size:13px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 30px}
footer a{color:var(--muted)}
@media print{header,.btns,footer,.card.top{display:none}.frame{border:0;margin:0}}
</style>
</head>
<body>
<div id="app"><div class="msg">Opening your bill…</div></div>
<script>
(function () {
  'use strict';
  var CLOUD = {url: 'https://zneltnwixmrkjbevxwaw.supabase.co', key: 'sb_publishable_hZy5OM-vGb-rgH_eRVVB_Q_vlGaXy4w'};
  var qs = new URLSearchParams(location.search);
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && qs.get('api')) CLOUD.url = qs.get('api'); // testing only
  var app = document.getElementById('app');
  var frag = location.hash.replace(/^#/, ''), dot = frag.indexOf('.'), id = frag.slice(0, dot), key = frag.slice(dot + 1);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function rs(n) { n = Math.round((+n || 0) * 100) / 100; return '₹' + n.toLocaleString('en-IN', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2}); }
  function day(ms) { return new Date(ms).toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}); }
  function fail(m) { app.innerHTML = '<header><div class="wrap"><h1>TezBooks</h1></div></header><div class="wrap"><div class="msg">' + esc(m) + '</div></div>'; }
  function unb64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  if (!/^[A-Za-z0-9_-]{16,32}$/.test(id) || !/^[A-Za-z0-9_-]{43}$/.test(key)) { fail('This link is not complete. Ask the shop to send it again.'); return; }
  if (!window.crypto || !crypto.subtle) { fail('Please open this link in Chrome or another up-to-date browser.'); return; }
  fetch(CLOUD.url + '/rest/v1/rpc/kb_bill_get', {method: 'POST', headers: {'Content-Type': 'application/json', apikey: CLOUD.key}, body: JSON.stringify({p_id: id})})
    .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); })
    .then(function (d) {
      if (!d || !d.found) { fail('This bill link has expired or is not valid. Ask the shop to send it again.'); return; }
      var all = unb64(d.blob), gz = all[0] === 1;
      return crypto.subtle.importKey('raw', unb64(key), 'AES-GCM', false, ['decrypt'])
        .then(function (k) { return crypto.subtle.decrypt({name: 'AES-GCM', iv: all.slice(1, 13), additionalData: new TextEncoder().encode('tezbooks-link-v1')}, k, all.slice(13)); })
        .then(function (plain) {
          if (!gz) return new TextDecoder().decode(plain);
          if (!window.DecompressionStream) throw new Error('old');
          return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
        })
        .then(function (txt) { show(JSON.parse(txt)); }, function (e) { fail(e && e.message === 'old' ? 'Please update your browser to open this bill.' : 'This link could not be opened. Ask the shop to send it again.'); });
    })
    .catch(function () { fail('Could not load the bill. Check your internet and try again.'); });

  function upiLink(sh, amount, note) { return 'upi://pay?pa=' + encodeURIComponent(sh.upiId) + '&pn=' + encodeURIComponent(sh.name || '') + '&am=' + (Math.round(amount * 100) / 100).toFixed(2) + '&cu=INR&tn=' + encodeURIComponent(note || ''); }
  function head(sh) { return '<header><div class="wrap"><h1>' + esc(sh.name || 'Shop') + '</h1><div class="sub">' + esc([sh.address, sh.phone].filter(Boolean).join(' · ')) + (sh.gstin ? '<br>GSTIN ' + esc(sh.gstin) : '') + '</div></div></header>'; }
  function payBox(sh, amount, note) {
    if (!sh.upiId || !(amount > 0)) return '';
    return '<a class="btn pri" href="' + esc(upiLink(sh, amount, note)) + '">Pay ' + rs(amount) + ' by UPI</a><button class="btn" id="copyUpi">Copy UPI ID</button>';
  }
  function wireCopy(sh) { var c = document.getElementById('copyUpi'); if (c) c.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(sh.upiId) : Promise.reject()).then(function () { c.textContent = 'Copied ' + sh.upiId; }, function () { c.textContent = sh.upiId; }); }; }

  function show(b) {
    var sh = b.shop || {};
    document.title = (b.kind === 'statement' ? 'Your account' : (b.title || 'Bill') + ' ' + (b.no || '')) + ' · ' + (sh.name || '');
    if (b.kind === 'statement') {
      app.innerHTML = head(sh) + '<div class="wrap"><div class="card top"><div class="small">Account of</div><div style="font-weight:800;font-size:18px">' + esc(b.customer) + '</div>' +
        '<div class="row" style="margin-top:8px"><span>Balance to pay</span><span class="big due">' + rs(b.balance) + '</span></div><div class="small">As on ' + day(b.date) + '</div>' +
        '<div class="btns">' + payBox(sh, b.balance, 'Balance ' + (b.customer || '')) + '</div></div>' +
        (b.bills && b.bills.length ? '<div class="card"><table><thead><tr><th>Bill</th><th>Date</th><th class="r">Total</th><th class="r">Unpaid</th></tr></thead><tbody>' + b.bills.map(function (x) { return '<tr><td class="mono" style="white-space:nowrap;font-size:13px">' + esc(x.no) + '</td><td>' + day(x.date) + '</td><td class="r mono">' + rs(x.total) + '</td><td class="r mono due">' + rs(x.due) + '</td></tr>'; }).join('') + '</tbody></table><div class="small" style="margin-top:8px">Payments you made recently may take a little time to show here.</div></div>' : '') +
        '<footer>Sent by ' + esc(sh.name || 'the shop') + ' using <a href="/">TezBooks</a> · only people with this link can see it</footer></div>';
      wireCopy(sh); return;
    }
    var cancelled = b.status === 'cancelled';
    app.innerHTML = head(sh) + '<div class="wrap"><div class="card top"><div class="row"><span><b>' + esc(b.title || 'Bill') + '</b> <span class="mono">' + esc(b.no) + '</span></span><span class="small">' + day(b.date) + '</span></div>' +
      (b.customer ? '<div class="small">For ' + esc(b.customer) + '</div>' : '') +
      '<div class="row" style="margin-top:8px"><span>Total</span><span class="big">' + rs(b.total) + '</span></div>' +
      (cancelled ? '<div class="due" style="font-weight:800">This bill was cancelled</div>' : b.due > 0 ? '<div class="row"><span>Paid</span><span class="mono">' + rs(b.paid) + '</span></div><div class="row"><span><b>Balance due</b></span><span class="mono due" style="font-size:18px">' + rs(b.due) + '</span></div>' : b.title === 'Tax Invoice' || b.title === 'Invoice' ? '<div class="paid" style="font-weight:700">Paid' + (b.payMode && b.payMode !== 'Credit' ? ' · ' + esc(b.payMode) : '') + ' ✓</div>' : '') +
      '<div class="btns">' + (cancelled ? '' : payBox(sh, b.due, b.no)) + '<button class="btn" id="pdf">Save as PDF / Print</button></div></div>' +
      '<div class="frame" id="frame"><iframe id="bill" title="Bill" sandbox="allow-same-origin allow-modals"></iframe></div>' +
      '<footer>Sent by ' + esc(sh.name || 'the shop') + ' using <a href="/">TezBooks</a> · only people with this link can see it</footer></div>';
    wireCopy(sh);
    var f = document.getElementById('bill'), W = b.paper === '80mm' ? 330 : 820;
    f.srcdoc = b.html || '<p>No bill copy.</p>';
    function fit() {
      var box = document.getElementById('frame'); if (!box) return;
      var s = Math.min(1, box.clientWidth / W), d = f.contentDocument, h = d && d.documentElement ? d.documentElement.scrollHeight : 1200;
      f.style.width = W + 'px'; f.style.height = h + 'px'; f.style.transform = 'scale(' + s + ')'; box.style.height = Math.ceil(h * s) + 'px';
    }
    f.onload = function () { fit(); setTimeout(fit, 600); setTimeout(fit, 1500); };
    window.addEventListener('resize', fit);
    document.getElementById('pdf').onclick = function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.print(); } };
  }
})();
</script>
</body>
</html>
